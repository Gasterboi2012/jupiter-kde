[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jupiter-installer"
version = "0.1.0"
description = "Minimal text installer for the Jupiter KDE distribution"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jupiter-installer = "jupiter_installer.app:main"

[tool.setuptools.packages.find]
include = ["jupiter_installer*"]

[tool.setuptools.package-data]
jupiter_installer = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
